<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design Studio — Outmarket</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --colors\/text\/primary:            #1b1d1d;
      --colors\/text\/secondary:          #525965;
      --colors\/text\/tertiary:           #6a758a;
      --colors\/text\/quaternary:         #97a0b4;
      --colors\/text\/interactive:        #6a56f0;
      --colors\/border\/border-primary:   #E7EBEE;
      --colors\/border\/border-subtle:    #F2F4F7;
      --colors\/border\/border-strong:    #D0D5DD;
      --colors\/background\/bg-primary:   #ffffff;
      --colors\/background\/bg-secondary: #f9fafb;
      --bg-muted:          #F2F4F7;
      --bg-accent-subtle:  #f5f3ff;
      --bg-accent-solid:   #6a56f0;
      --radius-md:  8px;
      --radius-xl:  12px;
      --radius-2xl: 16px;
      --font-size\/text-xs:    12px;
      --font-size\/text-sm:    14px;
      --font-size\/text-md:    16px;
      --font-size\/text-lg:    18px;
      --font-size\/display-xs: 24px;
      --font-weight\/regular:  400;
      --font-weight\/medium:   500;
      --font-weight\/semibold: 600;
      --font-weight\/bold:     700;
      --font-family\/font-family-body: 'Inter', sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family\/font-family-body);
      /* Very subtle lavender-tinted page background */
      background: #f7f7fc;
      color: var(--colors\/text\/primary);
      min-height: 100vh;
    }

    /* ── Top bar ── */
    .ds-topbar {
      padding: 24px 40px;
      background: #f7f7fc;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .ds-topbar-left { display: flex; flex-direction: column; gap: 2px; }

    .ds-title {
      font-size: var(--font-size\/display-xs);
      font-weight: var(--font-weight\/semibold);
      color: var(--colors\/text\/primary);
      letter-spacing: -0.4px;
      line-height: 1.3;
    }

    .ds-subtitle {
      font-size: var(--font-size\/text-sm);
      color: var(--colors\/text\/tertiary);
    }

    .ds-topbar-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .ds-search-wrap { position: relative; }
    .ds-search-wrap svg {
      position: absolute; left: 11px; top: 50%; transform: translateY(-50%);
      color: var(--colors\/text\/quaternary); pointer-events: none;
    }
    .ds-search {
      width: 240px; height: 36px;
      padding: 0 12px 0 34px;
      border: 1.5px solid var(--colors\/border\/border-primary);
      border-radius: var(--radius-md);
      font-size: var(--font-size\/text-sm);
      font-family: var(--font-family\/font-family-body);
      color: var(--colors\/text\/primary);
      background: var(--colors\/background\/bg-primary);
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .ds-search::placeholder { color: var(--colors\/text\/quaternary); }
    .ds-search:focus {
      border-color: var(--bg-accent-solid);
      box-shadow: 0 0 0 3px rgba(106,86,240,0.1);
    }

    .ds-filter-btn {
      height: 36px; padding: 0 14px;
      display: flex; align-items: center; gap: 6px;
      border: 1.5px solid var(--colors\/border\/border-primary);
      border-radius: var(--radius-md);
      background: var(--colors\/background\/bg-primary);
      font-size: var(--font-size\/text-sm);
      font-weight: var(--font-weight\/medium);
      font-family: var(--font-family\/font-family-body);
      color: var(--colors\/text\/secondary);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .ds-filter-btn:hover { background: var(--bg-muted); border-color: var(--colors\/border\/border-strong); }

    /* ── Grid ── */
    .ds-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      padding: 8px 40px 48px;
    }

    /* ── Tile wrapper ── */
    .ds-tile {
      display: flex;
      flex-direction: column;
      gap: 16px;
      cursor: pointer;
    }
    .ds-tile.hidden { display: none; }

    /* ── Preview card ── */
    .ds-tile-preview {
      height: 200px;
      background: #eeeef6;   /* light lavender-grey, matches reference */
      border-radius: var(--radius-2xl);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
    }
    .ds-tile:hover .ds-tile-preview {
      background: #e8e8f2;
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(106,86,240,0.1);
    }

    /* ── Tile footer (below preview) ── */
    .ds-tile-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
    }

    .ds-tile-info { display: flex; flex-direction: column; gap: 3px; }

    .ds-tile-name {
      font-size: 20px;
      font-weight: var(--font-weight\/bold);
      color: var(--colors\/text\/primary);
      letter-spacing: -0.2px;
      line-height: 1.3;
    }

    .ds-tile-count {
      font-size: var(--font-size\/text-sm);
      color: var(--colors\/text\/quaternary);
      font-weight: var(--font-weight\/regular);
    }

    /* ── NEW button ── */
    .ds-tile-new {
      flex-shrink: 0;
      height: 32px;
      padding: 0 14px;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1.5px solid var(--colors\/border\/border-primary);
      border-radius: var(--radius-md);
      background: var(--colors\/background\/bg-primary);
      font-size: 11px;
      font-weight: var(--font-weight\/semibold);
      font-family: var(--font-family\/font-family-body);
      letter-spacing: 0.06em;
      color: var(--bg-accent-solid);
      cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
      white-space: nowrap;
      text-transform: uppercase;
    }
    .ds-tile-new:hover {
      background: var(--bg-accent-subtle);
      border-color: var(--bg-accent-solid);
    }

    /* ── Empty state ── */
    .ds-empty {
      display: none;
      grid-column: 1 / -1;
      padding: 64px 0;
      text-align: center;
      color: var(--colors\/text\/quaternary);
      font-size: var(--font-size\/text-sm);
    }
    .ds-empty.visible { display: block; }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div class="ds-topbar">
    <div class="ds-topbar-left">
      <h1 class="ds-title">Design Studio</h1>
      <p class="ds-subtitle">Manage your reusable design assets</p>
    </div>
    <div class="ds-topbar-right">
      <div class="ds-search-wrap">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input class="ds-search" id="ds-search" type="text" placeholder="Search assets…" oninput="filterTiles(this.value)">
      </div>
      <button class="ds-filter-btn">
        <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="8" y1="12" x2="16" y2="12"/>
          <line x1="11" y1="18" x2="13" y2="18"/>
        </svg>
        Filter
      </button>
    </div>
  </div>

  <!-- Tile grid -->
  <div class="ds-grid" id="ds-grid">

    <!-- ── Headers ── -->
    <div class="ds-tile" data-name="Headers" onclick="openSection('Headers')">
      <div class="ds-tile-preview">
        <svg width="300" height="200" viewBox="0 0 300 200" fill="none">
          <!-- Minimal header bar strip -->
          <rect x="40" y="72" width="220" height="56" rx="8" fill="white" opacity="0.7"/>
          <!-- Logo dot -->
          <circle cx="64" cy="100" r="8" fill="#c7c4f0" opacity="0.9"/>
          <!-- Nav lines -->
          <rect x="86" y="96" width="28" height="4" rx="2" fill="#d8d6ef" opacity="0.8"/>
          <rect x="122" y="96" width="22" height="4" rx="2" fill="#d8d6ef" opacity="0.8"/>
          <rect x="152" y="96" width="26" height="4" rx="2" fill="#d8d6ef" opacity="0.8"/>
          <!-- CTA button shape -->
          <rect x="210" y="91" width="38" height="18" rx="5" fill="#c7c4f0" opacity="0.7"/>
          <!-- Bottom divider line -->
          <line x1="40" y1="128" x2="260" y2="128" stroke="#c7c4f0" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="ds-tile-footer">
        <div class="ds-tile-info">
          <div class="ds-tile-name">Headers</div>
          <div class="ds-tile-count">24 items</div>
        </div>
        <button class="ds-tile-new" onclick="newItem(event,'Headers')">New</button>
      </div>
    </div>

    <!-- ── Footers ── -->
    <div class="ds-tile" data-name="Footers" onclick="openSection('Footers')">
      <div class="ds-tile-preview">
        <svg width="300" height="200" viewBox="0 0 300 200" fill="none">
          <!-- Footer card -->
          <rect x="48" y="56" width="204" height="88" rx="10" fill="white" opacity="0.75"/>
          <!-- Logo row -->
          <rect x="68" y="76" width="14" height="10" rx="2" fill="#c7c4f0" opacity="0.8"/>
          <!-- Column link stubs -->
          <rect x="96"  y="76" width="24" height="3.5" rx="1.75" fill="#d4d2ee" opacity="0.9"/>
          <rect x="96"  y="83" width="18" height="3" rx="1.5" fill="#dddcf2" opacity="0.7"/>
          <rect x="96"  y="89" width="21" height="3" rx="1.5" fill="#dddcf2" opacity="0.7"/>
          <rect x="136" y="76" width="20" height="3.5" rx="1.75" fill="#d4d2ee" opacity="0.9"/>
          <rect x="136" y="83" width="26" height="3" rx="1.5" fill="#dddcf2" opacity="0.7"/>
          <rect x="136" y="89" width="16" height="3" rx="1.5" fill="#dddcf2" opacity="0.7"/>
          <rect x="176" y="76" width="28" height="3.5" rx="1.75" fill="#d4d2ee" opacity="0.9"/>
          <rect x="176" y="83" width="20" height="3" rx="1.5" fill="#dddcf2" opacity="0.7"/>
          <rect x="176" y="89" width="24" height="3" rx="1.5" fill="#dddcf2" opacity="0.7"/>
          <!-- Bottom strip -->
          <rect x="48" y="124" width="204" height="20" rx="5" fill="white" opacity="0.4"/>
          <rect x="68" y="131" width="48" height="2.5" rx="1.25" fill="#d8d6ef" opacity="0.7"/>
        </svg>
      </div>
      <div class="ds-tile-footer">
        <div class="ds-tile-info">
          <div class="ds-tile-name">Footers</div>
          <div class="ds-tile-count">12 items</div>
        </div>
        <button class="ds-tile-new" onclick="newItem(event,'Footers')">New</button>
      </div>
    </div>

    <!-- ── Page Styles ── -->
    <div class="ds-tile" data-name="Page Styles" onclick="openSection('Page Styles')">
      <div class="ds-tile-preview">
        <svg width="300" height="200" viewBox="0 0 300 200" fill="none">
          <!-- 4 large swatches -->
          <circle cx="90"  cy="100" r="36" fill="#6a56f0"/>
          <circle cx="158" cy="100" r="36" fill="#1b1d1d"/>
          <circle cx="226" cy="100" r="36" fill="#c7c4f0"/>
          <!-- Selected ring on first -->
          <circle cx="90"  cy="100" r="40" fill="none" stroke="#6a56f0" stroke-width="2" opacity="0.35"/>
        </svg>
      </div>
      <div class="ds-tile-footer">
        <div class="ds-tile-info">
          <div class="ds-tile-name">Page Styles</div>
          <div class="ds-tile-count">8 items</div>
        </div>
        <button class="ds-tile-new" onclick="newItem(event,'Page Styles')">New</button>
      </div>
    </div>

    <!-- ── Blocks ── -->
    <div class="ds-tile" data-name="Blocks" onclick="openSection('Blocks')">
      <div class="ds-tile-preview">
        <svg width="300" height="200" viewBox="0 0 300 200" fill="none">
          <!-- 2×2 block cards -->
          <rect x="60"  y="52"  width="80" height="44" rx="8" fill="white" opacity="0.8"/>
          <rect x="160" y="52"  width="80" height="44" rx="8" fill="white" opacity="0.8"/>
          <rect x="60"  y="104" width="80" height="44" rx="8" fill="white" opacity="0.8"/>
          <rect x="160" y="104" width="80" height="44" rx="8" fill="white" opacity="0.8"/>
          <!-- Subtle content stubs inside each -->
          <rect x="72" y="66" width="42" height="4" rx="2" fill="#d8d6ef" opacity="0.8"/>
          <rect x="72" y="74" width="34" height="3" rx="1.5" fill="#e2e0f5" opacity="0.7"/>
          <rect x="172" y="66" width="42" height="4" rx="2" fill="#d8d6ef" opacity="0.8"/>
          <rect x="172" y="74" width="34" height="3" rx="1.5" fill="#e2e0f5" opacity="0.7"/>
          <rect x="72" y="118" width="42" height="4" rx="2" fill="#d8d6ef" opacity="0.8"/>
          <rect x="72" y="126" width="34" height="3" rx="1.5" fill="#e2e0f5" opacity="0.7"/>
          <rect x="172" y="118" width="42" height="4" rx="2" fill="#d8d6ef" opacity="0.8"/>
          <rect x="172" y="126" width="34" height="3" rx="1.5" fill="#e2e0f5" opacity="0.7"/>
        </svg>
      </div>
      <div class="ds-tile-footer">
        <div class="ds-tile-info">
          <div class="ds-tile-name">Blocks</div>
          <div class="ds-tile-count">23 items</div>
        </div>
        <button class="ds-tile-new" onclick="newItem(event,'Blocks')">New</button>
      </div>
    </div>

    <!-- ── Templates ── -->
    <div class="ds-tile" data-name="Templates" onclick="openSection('Templates')">
      <div class="ds-tile-preview">
        <svg width="300" height="200" viewBox="0 0 300 200" fill="none">
          <!-- Single document card, centered and tall -->
          <rect x="96" y="28" width="108" height="144" rx="10" fill="white" opacity="0.82"/>
          <!-- Header band -->
          <rect x="96" y="28" width="108" height="24" rx="10" fill="#c7c4f0" opacity="0.55"/>
          <rect x="96" y="42" width="108" height="10" fill="#c7c4f0" opacity="0.55"/>
          <!-- Body content stubs -->
          <rect x="112" y="64" width="76" height="5" rx="2.5" fill="#d8d6ef" opacity="0.9"/>
          <rect x="112" y="74" width="62" height="3.5" rx="1.75" fill="#e2e0f5" opacity="0.75"/>
          <rect x="112" y="81" width="68" height="3.5" rx="1.75" fill="#e2e0f5" opacity="0.75"/>
          <rect x="112" y="88" width="56" height="3.5" rx="1.75" fill="#e2e0f5" opacity="0.75"/>
          <!-- Section divider -->
          <line x1="112" y1="100" x2="188" y2="100" stroke="#e0def4" stroke-width="1" stroke-linecap="round"/>
          <!-- Second section -->
          <rect x="112" y="108" width="76" height="4" rx="2" fill="#d8d6ef" opacity="0.8"/>
          <rect x="112" y="116" width="60" height="3.5" rx="1.75" fill="#e2e0f5" opacity="0.7"/>
          <rect x="112" y="123" width="70" height="3.5" rx="1.75" fill="#e2e0f5" opacity="0.7"/>
          <!-- Footer CTA -->
          <rect x="112" y="140" width="38" height="14" rx="5" fill="#c7c4f0" opacity="0.7"/>
        </svg>
      </div>
      <div class="ds-tile-footer">
        <div class="ds-tile-info">
          <div class="ds-tile-name">Templates</div>
          <div class="ds-tile-count">6 items</div>
        </div>
        <button class="ds-tile-new" onclick="newItem(event,'Templates')">New</button>
      </div>
    </div>

    <!-- ── Image Library ── -->
    <div class="ds-tile" data-name="Image Library" onclick="openSection('Image Library')">
      <div class="ds-tile-preview">
        <svg width="300" height="200" viewBox="0 0 300 200" fill="none">
          <!-- 3×2 image frame grid -->
          <!-- Row 1 -->
          <rect x="50"  y="44" width="60" height="46" rx="7" fill="white" opacity="0.75"/>
          <rect x="120" y="44" width="60" height="46" rx="7" fill="white" opacity="0.75"/>
          <rect x="190" y="44" width="60" height="46" rx="7" fill="white" opacity="0.75"/>
          <!-- Row 2 -->
          <rect x="50"  y="98" width="60" height="46" rx="7" fill="white" opacity="0.75"/>
          <rect x="120" y="98" width="60" height="46" rx="7" fill="white" opacity="0.9"/>
          <rect x="190" y="98" width="60" height="46" rx="7" fill="white" opacity="0.75"/>

          <!-- Image icons inside each frame -->
          <!-- Row 1 icons -->
          <rect x="67"  y="56" width="26" height="22" rx="3" fill="#dddcf2" opacity="0.7"/>
          <polyline points="67,74 77,64 83,70 91,60 93,78" fill="#c7c4f0" opacity="0.5" stroke="none"/>
          <circle cx="72" cy="59" r="3" fill="#c7c4f0" opacity="0.8"/>

          <rect x="137" y="56" width="26" height="22" rx="3" fill="#dddcf2" opacity="0.7"/>
          <polyline points="137,74 147,66 153,71 161,61 163,78" fill="#c7c4f0" opacity="0.5" stroke="none"/>
          <circle cx="142" cy="59" r="3" fill="#c7c4f0" opacity="0.8"/>

          <rect x="207" y="56" width="26" height="22" rx="3" fill="#dddcf2" opacity="0.7"/>
          <polyline points="207,74 217,65 223,70 231,62 233,78" fill="#c7c4f0" opacity="0.5" stroke="none"/>
          <circle cx="212" cy="59" r="3" fill="#c7c4f0" opacity="0.8"/>

          <!-- Row 2 icons -->
          <rect x="67"  y="110" width="26" height="22" rx="3" fill="#dddcf2" opacity="0.7"/>
          <polyline points="67,128 77,118 83,123 91,114 93,132" fill="#c7c4f0" opacity="0.5" stroke="none"/>
          <circle cx="72" cy="113" r="3" fill="#c7c4f0" opacity="0.8"/>

          <!-- Middle bottom: selected/highlighted -->
          <rect x="137" y="110" width="26" height="22" rx="3" fill="#c7c4f0" opacity="0.5"/>
          <polyline points="137,128 147,120 153,124 161,115 163,132" fill="#9e98e0" opacity="0.6" stroke="none"/>
          <circle cx="142" cy="113" r="3" fill="#9e98e0" opacity="0.9"/>

          <rect x="207" y="110" width="26" height="22" rx="3" fill="#dddcf2" opacity="0.7"/>
          <polyline points="207,128 217,119 223,124 231,115 233,132" fill="#c7c4f0" opacity="0.5" stroke="none"/>
          <circle cx="212" cy="113" r="3" fill="#c7c4f0" opacity="0.8"/>
        </svg>
      </div>
      <div class="ds-tile-footer">
        <div class="ds-tile-info">
          <div class="ds-tile-name">Image Library</div>
          <div class="ds-tile-count">47 items</div>
        </div>
        <button class="ds-tile-new" onclick="newItem(event,'Image Library')">Upload</button>
      </div>
    </div>

    <!-- Empty state -->
    <div class="ds-empty" id="ds-empty">No assets match your search.</div>

  </div>

  <script>
    function openSection(name) {
      console.log('Open:', name);
    }
    function newItem(e, name) {
      e.stopPropagation();
      console.log('New:', name);
    }
    function filterTiles(query) {
      const q = query.toLowerCase().trim();
      let visible = 0;
      document.querySelectorAll('.ds-tile').forEach(tile => {
        const match = !q || tile.dataset.name.toLowerCase().includes(q);
        tile.classList.toggle('hidden', !match);
        if (match) visible++;
      });
      document.getElementById('ds-empty').classList.toggle('visible', visible === 0);
    }
  </script>

</body>
</html>
