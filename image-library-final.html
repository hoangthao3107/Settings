<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Image Library — Final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── Outmarket Design Tokens ───────────────────────────────── */
:root {
  --text-primary:      #1b1d1d;
  --text-secondary:    #343839;
  --text-tertiary:     #525965;
  --text-quaternary:   #97a0b4;
  --text-interactive:  #6a56f0;

  --border-default:    #e7ebee;
  --border-strong:     #d0d5dd;
  --border-accent:     #6a56f0;

  --bg-white:          #ffffff;
  --bg-subtle:         #f9fafb;
  --bg-muted:          #f2f4f7;
  --bg-active:         #f6f7fe;   /* active sidebar tab */

  --accent:            #6a56f0;

  --r-md: 8px;
  --r-xl: 12px;

  --shadow: 0px 12px 16px -4px rgba(52,56,57,0.08),
            0px 4px 6px -2px rgba(52,56,57,0.03);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', sans-serif;
  background: #e8eaf0;
  background-image: radial-gradient(circle, #bbbec9 1px, transparent 1px);
  background-size: 24px 24px;
  min-height: 100vh;
  padding: 48px 40px 80px;
  -webkit-font-smoothing: antialiased;
}

.page-meta {
  text-align: center;
  margin-bottom: 48px;
}
.page-meta h1 {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #666;
  margin-bottom: 6px;
}
.page-meta p { font-size: 13px; color: #888; }

.stage {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 48px;
  flex-wrap: wrap;
}

.frame-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.frame-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.frame-label .tag {
  font-size: 10px;
  font-weight: 600;
  color: #fff;
  background: var(--accent);
  padding: 2px 9px;
  border-radius: 99px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.frame-label .title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-primary);
}

/* ════════════════════════════════════════════════════════════
   POPOVER  400 × 640 px
   ════════════════════════════════════════════════════════════ */
.il {
  width: 400px;
  height: 640px;
  background: var(--bg-white);
  border: 1px solid var(--border-default);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-family: 'Inter', sans-serif;
}

/* ── Header  64px ─────────────────────────────────────────── */
.il-header {
  height: 64px;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--border-default);
  flex-shrink: 0;
}
.il-title {
  font-size: 16px;
  font-weight: 600;
  line-height: 24px;
  color: var(--text-primary);
}
/* "New category" ghost button — 142 × 32px */
.il-new-cat {
  height: 32px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  background: var(--bg-white);
  font-family: 'Inter', sans-serif;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-secondary);
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.12s;
}
.il-new-cat:hover { background: var(--bg-subtle); }

/* ── Body  576px ──────────────────────────────────────────── */
.il-body {
  flex: 1;
  display: flex;
  min-height: 0;
}

/* ── Sidebar wrapper  150px (inner sidebar 134px + 16px right gap) */
.il-sidebar-wrap {
  width: 150px;
  flex-shrink: 0;
}
.il-sidebar {
  width: 134px;
  height: 100%;
  border-right: 1px solid var(--border-default);
  padding: 16px 8px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.il-sidebar::-webkit-scrollbar { width: 3px; }
.il-sidebar::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 2px; }

/* Tab item  117 × 40px */
.il-tab {
  width: 117px;
  height: 40px;
  padding: 0 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border: none;
  border-radius: var(--r-md);
  background: transparent;
  cursor: pointer;
  transition: background 0.1s;
  text-align: left;
}
.il-tab:hover { background: var(--bg-muted); }
.il-tab.active { background: var(--bg-active); }

.il-tab-name {
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  color: var(--text-secondary);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.il-tab.active .il-tab-name { color: var(--text-interactive); font-weight: 600; }

.il-tab-count {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-quaternary);
  flex-shrink: 0;
  margin-left: 4px;
}
.il-tab.active .il-tab-count { color: var(--text-interactive); }

/* ── Content area  250px (usable 234px with 8px padding each side) */
.il-content {
  flex: 1;
  overflow-y: auto;
  padding: 12px 8px 16px 8px;
  display: flex;
  flex-direction: column;
}
.il-content::-webkit-scrollbar { width: 3px; }
.il-content::-webkit-scrollbar-thumb { background: var(--border-default); border-radius: 2px; }

/* ── Section label row ──────────────────────────────────────
   "Folder" row: label on left, icon-button (+) on right, 24px tall */
.il-section-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 24px;
  margin-bottom: 4px;
}
.il-section-label {
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  color: var(--text-tertiary);
}
.il-icon-btn {
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  border-radius: 6px;
  background: transparent;
  color: var(--text-quaternary);
  cursor: pointer;
  transition: background 0.1s, color 0.1s;
  flex-shrink: 0;
}
.il-icon-btn:hover { background: var(--bg-muted); color: var(--text-secondary); }

/* ── Folder rows  42px with bg+border ─────────────────────── */
.il-folder-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 16px;
}
.il-folder-row {
  height: 42px;
  display: flex;
  align-items: center;
  padding: 0 13px;
  gap: 8px;
  background: var(--bg-subtle);
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  cursor: pointer;
  transition: border-color 0.12s, background 0.1s;
  text-align: left;
  width: 100%;
}
.il-folder-row:hover {
  border-color: var(--border-strong);
  background: var(--bg-white);
}
.il-folder-icon { color: var(--text-quaternary); flex-shrink: 0; display: flex; align-items: center; }
.il-folder-name {
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  color: var(--text-secondary);
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.il-folder-count {
  font-size: 12px;
  font-weight: 400;
  color: var(--text-quaternary);
  flex-shrink: 0;
  margin-right: 2px;
}
.il-chevron { color: var(--text-quaternary); flex-shrink: 0; display: flex; align-items: center; }

/* ── "Images" section label ─────────────────────────────────  */
.il-images-label {
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  color: var(--text-tertiary);
  margin-bottom: 8px;
}

/* ── 3-column image grid
   234px usable = 3 × 72.67 + 2 × 8  →  use auto sizing          */
.il-img-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

/* Upload card — same cell size, dashed border, centered + icon */
.il-upload-card {
  aspect-ratio: 1;
  background: var(--bg-subtle);
  border: 1.5px dashed var(--border-strong);
  border-radius: var(--r-md);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
  color: var(--text-quaternary);
}
.il-upload-card:hover {
  border-color: var(--accent);
  background: var(--bg-active);
  color: var(--accent);
}

/* Image card */
.il-img-card {
  aspect-ratio: 1;
  background: var(--bg-subtle);
  border: 1px solid var(--border-default);
  border-radius: var(--r-md);
  overflow: hidden;
  cursor: pointer;
  transition: border-color 0.12s, box-shadow 0.12s;
}
.il-img-card:hover {
  border-color: var(--border-accent);
  box-shadow: 0 0 0 2px rgba(106,86,240,0.12);
}
.il-img-thumb {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

/* ── Folder drill-in header (inside content area) ──────────── */
.il-drill-nav {
  margin-bottom: 12px;
}
.il-back-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-interactive);
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  margin-bottom: 6px;
  transition: background 0.1s;
}
.il-back-link:hover { background: var(--bg-active); }
.il-drill-folder-name {
  font-size: 14px;
  font-weight: 600;
  line-height: 20px;
  color: var(--text-primary);
}
</style>
</head>
<body>

<div class="page-meta">
  <h1>Image Library — Final Design</h1>
  <p>Pixel-perfect implementation · Figma node 29516:293672 · 400×640px</p>
</div>

<div class="stage">

  <!-- ══════════════════════════════════════════════════════
       FRAME 1 — Category view: folders + images
       ══════════════════════════════════════════════════════ -->
  <div class="frame-wrap">
    <div class="frame-label">
      <span class="tag">Frame 1</span>
      <span class="title">Category view — folders + images</span>
    </div>

    <div class="il">
      <!-- Header -->
      <div class="il-header">
        <span class="il-title">Image Library</span>
        <button class="il-new-cat">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          New category
        </button>
      </div>

      <!-- Body -->
      <div class="il-body">

        <!-- Sidebar -->
        <div class="il-sidebar-wrap">
          <div class="il-sidebar" id="sidebar-1">
            <!-- tabs injected by JS -->
          </div>
        </div>

        <!-- Content -->
        <div class="il-content">

          <!-- ── Folder section ── -->
          <div class="il-section-row">
            <span class="il-section-label">Folder</span>
            <button class="il-icon-btn" title="New folder">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>

          <div class="il-folder-list">
            <button class="il-folder-row">
              <span class="il-folder-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M2 4.5C2 3.67 2.67 3 3.5 3h3l1.5 1.5H12.5C13.33 4.5 14 5.17 14 6v5.5C14 12.33 13.33 13 12.5 13h-9C2.67 13 2 12.33 2 11.5v-7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="il-folder-name">Folder name</span>
              <span class="il-folder-count">15</span>
              <span class="il-chevron">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </button>
            <button class="il-folder-row">
              <span class="il-folder-icon">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M2 4.5C2 3.67 2.67 3 3.5 3h3l1.5 1.5H12.5C13.33 4.5 14 5.17 14 6v5.5C14 12.33 13.33 13 12.5 13h-9C2.67 13 2 12.33 2 11.5v-7z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
                </svg>
              </span>
              <span class="il-folder-name">Sub-background longer name</span>
              <span class="il-folder-count">13</span>
              <span class="il-chevron">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                  <path d="M6 4l4 4-4 4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
            </button>
          </div>

          <!-- ── Images section ── -->
          <div class="il-images-label">Images</div>
          <div class="il-img-grid" id="grid-1">
            <!-- Upload card (cell 0) -->
            <div class="il-upload-card" title="Upload image">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <!-- image cards injected by JS -->
          </div>

        </div><!-- end .il-content -->
      </div><!-- end .il-body -->
    </div><!-- end .il -->
  </div>

  <!-- ══════════════════════════════════════════════════════
       FRAME 2 — Folder drill-in view
       ══════════════════════════════════════════════════════ -->
  <div class="frame-wrap">
    <div class="frame-label">
      <span class="tag">Frame 2</span>
      <span class="title">Folder drill-in view</span>
    </div>

    <div class="il">
      <!-- Header (unchanged) -->
      <div class="il-header">
        <span class="il-title">Image Library</span>
        <button class="il-new-cat">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
            <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          New category
        </button>
      </div>

      <!-- Body -->
      <div class="il-body">

        <!-- Sidebar (same, active tab unchanged) -->
        <div class="il-sidebar-wrap">
          <div class="il-sidebar" id="sidebar-2">
            <!-- tabs injected by JS -->
          </div>
        </div>

        <!-- Content: folder drill-in -->
        <div class="il-content">

          <!-- Back link + folder title -->
          <div class="il-drill-nav">
            <button class="il-back-link">
              <svg width="13" height="13" viewBox="0 0 14 14" fill="none">
                <path d="M9 2L4 7l5 5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Backgrounds
            </button>
            <div class="il-drill-folder-name">Folder name</div>
          </div>

          <!-- 3-col grid -->
          <div class="il-img-grid" id="grid-2">
            <!-- Upload card (cell 0) -->
            <div class="il-upload-card" title="Upload to this folder">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </div>
            <!-- image cards injected by JS -->
          </div>

        </div><!-- end .il-content -->
      </div><!-- end .il-body -->
    </div><!-- end .il -->
  </div>

</div><!-- end .stage -->

<script>
/* ── Data ─────────────────────────────────────────────────── */
const TABS = [
  { name: 'Backgrounds', count: 23, active: true  },
  { name: 'Logo',        count: 124               },
  { name: 'Profiles',    count: 45                },
  { name: 'Icons',       count: 89                },
  { name: 'Clipboard',   count: 15                },
  { name: 'C3-Library',  count: 15                },
  { name: 'C3-Library',  count: 15                },
  { name: 'C3-Library',  count: 15                },
];

const IMG_SEEDS_CAT  = ['bg01','bg02','bg03','bg04','bg05','bg06','bg07','bg08','bg09','bg10','bg11','bg12','bg13','bg14','bg15'];
const IMG_SEEDS_FOLD = ['f01','f02','f03','f04','f05','f06','f07','f08','f09'];

/* ── Builders ─────────────────────────────────────────────── */
function buildSidebar(id, tabs) {
  const el = document.getElementById(id);
  el.innerHTML = tabs.map(t => `
    <button class="il-tab ${t.active ? 'active' : ''}">
      <span class="il-tab-name">${t.name}</span>
      <span class="il-tab-count">${t.count}</span>
    </button>
  `).join('');
}

function appendImages(gridId, seeds) {
  const grid = document.getElementById(gridId);
  seeds.forEach(seed => {
    const card = document.createElement('div');
    card.className = 'il-img-card';
    card.innerHTML = `<img class="il-img-thumb"
      src="https://picsum.photos/seed/${seed}/160/160"
      alt="" loading="lazy">`;
    grid.appendChild(card);
  });
}

/* ── Init ─────────────────────────────────────────────────── */
buildSidebar('sidebar-1', TABS);
buildSidebar('sidebar-2', TABS);
appendImages('grid-1', IMG_SEEDS_CAT);
appendImages('grid-2', IMG_SEEDS_FOLD);

/* ── Sidebar tab interaction ──────────────────────────────── */
[document.getElementById('sidebar-1'), document.getElementById('sidebar-2')].forEach(sidebar => {
  sidebar.querySelectorAll('.il-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      sidebar.querySelectorAll('.il-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
    });
  });
});
</script>
</body>
</html>
